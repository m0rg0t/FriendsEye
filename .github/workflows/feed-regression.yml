name: Portable feed regressions
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  feed-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        flavor: [Phone, Windows]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Exercise linked production ViewModel
        run: dotnet run --project tests/FeedRegression --configuration Release -p:Flavor=${{ matrix.flavor }}
